<!-- taller/templates/taller/partials/resultados_bicicletas.html -->
{% if resultados %}
    <ul class="max-h-60 rounded-md py-1 text-base ring-1 ring-black ring-opacity-5 overflow-auto focus:outline-none sm:text-sm">
        {% for bici in resultados %}
            <!-- Usamos un poquito de JavaScript nativo para asignar los valores y cerrar la lista -->
            <li class="cursor-pointer select-none relative py-2 pl-3 pr-9 hover:bg-blue-50 transition"
               onclick="
                    document.getElementById('id_bicicleta').value = '{{ bici.id }}';

                    let searchInput = document.getElementById('bici-search-input');
                    if (searchInput) searchInput.value = '🚲 {{ bici.marca }} {{ bici.modelo }} (👤 {{ bici.cliente.nombre }})';

                    /* NUEVO: Autocompletar datos si estamos en la Agenda */
                    let nombreInput = document.getElementById('id_nombre_cliente');
                    if (nombreInput) nombreInput.value = '{{ bici.cliente.nombre }}';

                    let telefonoInput = document.getElementById('id_telefono');
                    if (telefonoInput) telefonoInput.value = '{{ bici.cliente.telefono }}';

                    document.getElementById('search-results').innerHTML = '';
                ">
                <div class="flex flex-col">
                    <span class="font-semibold text-gray-800">{{ bici.cliente.nombre }}</span>
                    <span class="text-xs text-gray-500">{{ bici.marca }} {{ bici.modelo }} - Serie: {{ bici.n_serie|default:"N/A" }}</span>
                </div>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <div class="cursor-default select-none relative py-3 pl-3 pr-9 text-gray-500 text-sm italic">
        No se encontraron bicicletas. Verifica el nombre.
    </div>
{% endif %}
