<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Servicio Completo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border border-gray-200">
        
        <!-- Encabezado / Logo -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-widest text-blue-600 mb-2">SERVICIO COMPLETO</h1>
            <p class="text-gray-500 text-sm">Inicia sesión para acceder a tu sucursal</p>
        </div>

        <!-- Mostrar errores de login (ej. contraseña incorrecta) -->
        {% if form.errors %}
            <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded text-sm">
                <p>Tu nombre de usuario y contraseña no coinciden. Por favor, inténtalo de nuevo.</p>
            </div>
        {% endif %}

        <!-- Formulario de Login nativo de Django -->
        <form method="POST" action="{% url 'login' %}" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" 
                       class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-3 border bg-gray-50">
            </div>

            <div>
                <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" name="password" autocomplete="current-password" required id="id_password" 
                       class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-3 border bg-gray-50">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md shadow transition duration-200">
                Ingresar al Sistema
            </button>
            
            <!-- Campo oculto para redirigir si el usuario intentó entrar a una URL protegida -->
            <input type="hidden" name="next" value="{{ next }}">
        </form>

        <div class="mt-6 text-center">
            <p class="text-xs text-gray-400">&copy; {% now "Y" %} Servicio Completo SaaS. Todos los derechos reservados.</p>
        </div>
    </div>

</body>
</html>
